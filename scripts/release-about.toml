# Release attribution selection policy, not a blanket legal approval.
# Order selects Apache instead of GPL and MIT instead of LGPL alternatives.
accepted = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "CC0-1.0", "Unicode-3.0", "Zlib", "MPL-2.0", "bzip2-1.0.6",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
