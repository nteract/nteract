<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pages · nteract</title>
    <!-- scripts/build.mjs inlines the app icon (shared/favicon.mjs) here. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/app.css" />
    <!-- scripts/build.mjs adds a modulepreload after app.css for each chunk
         app.js imports, and replaces each source name on this page (theme.js,
         app.css, both WASM files, app.js) with its content-hashed file.
         The editor chunk awaits both runtimes before a Page opens. These
         preloads must match the fetches in scripts/browser-wasm.mjs: same URL,
         and crossorigin so the preload is a CORS same-origin-credentials fetch
         like fetch(url). -->
    <link rel="preload" href="/automerge.wasm" as="fetch" crossorigin />
    <link rel="preload" href="/subduction.wasm" as="fetch" crossorigin />
    <link rel="describedby" type="text/plain" href="/llms.txt" />
  </head>
  <body>
    <div id="root">
      <div class="app">
        <header class="app-header">
          <div class="header-navigation"><a href="/" class="brand">Pages</a></div>
        </header>
        <main class="welcome">
          <p role="status">Connecting…</p>
          <noscript>
            <p>Realtime documents for people and agents. Enable JavaScript to use the editor.</p>
            <p>
              Connecting an agent? Start with <a href="/connect">Connect an agent</a> and
              <a href="/llms.txt">the agent guide</a>. Coding agents and scripts use an API key;
              ChatGPT can authorize through OAuth. Ask the human early to save a key privately or
              authorize access while you prepare the settings. Never enable an empty-key connection.
            </p>
          </noscript>
        </main>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
