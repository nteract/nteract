[package]
name = "notebook-sync"
version = "0.6.2"
edition.workspace = true
description = "Automerge-based notebook sync client with direct document access"
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
automerge = { workspace = true }
automerge-recovery = { path = "../automerge-recovery" }
notebook-doc = { path = "../notebook-doc" }
runtime-doc = { path = "../runtime-doc" }
comments-doc = { path = "../comments-doc" }
notebook-protocol = { path = "../notebook-protocol" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

uuid = { workspace = true }
log = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
# Connect errors name the command that starts a daemon, and which command that
# is depends on dev-mode vs an installed build. This crate owns that answer.
runt-workspace = { path = "../runt-workspace" }

[dev-dependencies]
