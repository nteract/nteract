name: Trusted main preview

on:
  workflow_call:

permissions: {}

concurrency:
  group: runtimed-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: runtimed-main
      url: https://main.runtimed.run
    steps:
      - name: Check out reviewed main deployment helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nteract/nteract
          ref: cc55c85aec0441894941ac1f47321c4bc0e1231a # Reviewed main deployment helpers
          persist-credentials: false
          sparse-checkout: .github/preview
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      # This runner never checks out the build revision or downloads its artifact.
      # The controller verifies the source Build and artifact before deploying.
      - name: Deploy the current main revision and wait for readiness
        run: node .github/preview/send-main-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
