name: Trusted page10 deployment

on:
  workflow_call:
    inputs:
      enabled:
        type: boolean
        default: false
      sha:
        type: string
        default: ''
      build_run_id:
        type: string
        default: ''
      build_run_attempt:
        type: string
        default: ''

permissions: {}

concurrency:
  group: pages-page10-controller
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      inputs.enabled &&
      ((github.event_name == 'workflow_run' && vars.PAGES_PAGE10_AUTODEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' && vars.PAGES_PAGE10_MANUAL == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: pages-page10
      url: https://page10.runtimed.run
    steps:
      - name: Check out reviewed controller client only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nteract/nteract
          ref: 25b0cd6bcdd9fc4ee0f2b3042ede5ecaea1f88f6 # Reviewed main helpers: send the pages-release artifact (#4892)
          persist-credentials: false
          sparse-checkout: .github/preview
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      # No application checkout, artifact execution, AWS credentials or SSH.
      - name: Request page10 and report the persisted operation
        run: node .github/preview/send-pages-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_PAGE10_ENABLED: 'true'
          # lab1 policy pages.releaseSource must be artifact-optional or artifact-required.
          PAGES_SEND_ARTIFACT: 'true'
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
