name: Rich text codec

on:
  pull_request:
    paths:
      - crates/nteract-rich-text/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - docs/memos/authenticated-automerge-app-substrate/experiment/pages/model/richtext.mjs
      - docs/memos/authenticated-automerge-app-substrate/experiment/pages/viewer/wordgard-model.mjs
      - docs/memos/authenticated-automerge-app-substrate/experiment/pages/package.json
      - docs/memos/authenticated-automerge-app-substrate/experiment/package-lock.json
      - .github/workflows/rich-text-codec.yml
  push:
    branches: [main]
    paths:
      - crates/nteract-rich-text/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - docs/memos/authenticated-automerge-app-substrate/experiment/pages/model/richtext.mjs
      - docs/memos/authenticated-automerge-app-substrate/experiment/pages/viewer/wordgard-model.mjs
      - docs/memos/authenticated-automerge-app-substrate/experiment/pages/package.json
      - docs/memos/authenticated-automerge-app-substrate/experiment/package-lock.json
      - .github/workflows/rich-text-codec.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rich-text-codec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Native, WASM, and Pages compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dsherret/rust-toolchain-file@v1
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Pages compatibility oracle
        working-directory: docs/memos/authenticated-automerge-app-substrate/experiment
        run: npm run setup
      - run: cargo test -p nteract-rich-text --features automerge --locked
      - run: cargo clippy -p nteract-rich-text --all-targets --features automerge --locked -- -D warnings
      - run: cargo build -p nteract-rich-text --example codec --locked
      - run: cargo build -p nteract-rich-text --target wasm32-unknown-unknown --locked
      - name: Check oracle drift and native/WASM parity
        run: |
          node crates/nteract-rich-text/scripts/generate-fixtures.mjs --check
          node crates/nteract-rich-text/scripts/check-parity.mjs
