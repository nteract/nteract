name: Nightly Release

on:
  schedule:
    # Every day at 9am UTC (24h cadence)
    - cron: "0 9 * * *"
  workflow_dispatch:

# Serialize publication within this channel without cancelling an active release.
concurrency:
  group: nteract-release-nightly
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-common.yml
    # Ceiling for the reusable workflow. Its jobs can request at most these
    # scopes; each job in release-common.yml narrows further with its own
    # `permissions:` block. `packages: write` exists only so the two
    # runtime-peer image jobs can push to ghcr.io/nteract/runtime-peer.
    permissions:
      contents: write
      id-token: write
      packages: write
    secrets: inherit
    with:
      release_title: "Nightly Release"
      version_suffix: "nightly"
      manifest_notes_prefix: "Nightly release"
      release_intro: "Automated nightly release."
      github_release_prerelease: true
      updater_channel_tag: "nightly-latest"
      updater_channel_title: "Nightly Update Channel"
      updater_channel_notes: "Rolling release for the nightly auto-update channel. This release always contains the latest updater manifest. Do not delete this release."
      updater_channel_prerelease: true
      publish_plugin_channel: "nightly"
