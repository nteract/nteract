name: Pages experiment

# A green push run of this workflow is the page10 deployment gate, so it holds
# only the unit tests and build. Browser E2E runs in pages-browser-e2e.yml.

on:
  pull_request:
    paths:
      - apps/pages/**
      - apps/notebook-cloud/src/**
      - packages/local-oidc/src/**
      - packages/runtimed/src/scope-capabilities.ts
      - src/components/markdown/mermaid-renderer.ts
      - src/components/sharing/**
      - src/styles/notebook-tokens.css
      - .github/workflows/authenticated-automerge-spike.yml
  push:
    branches: [main]
    paths:
      - apps/pages/**
      - apps/notebook-cloud/src/**
      - packages/local-oidc/src/**
      - packages/runtimed/src/scope-capabilities.ts
      - src/components/markdown/mermaid-renderer.ts
      - src/components/sharing/**
      - src/styles/notebook-tokens.css
      - .github/workflows/authenticated-automerge-spike.yml
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs. Every main push runs to completion on
# its own SHA, so a burst of merges cannot cancel each candidate in turn and
# leave page10 with no green commit to deploy.
concurrency:
  group: authenticated-automerge-spike-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Pages and authenticated Automerge integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/pages
            apps/notebook-cloud/src
            packages/runtimed/src
            packages/local-oidc/src
            src/components/markdown
            src/components/sharing
            src/styles
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      # No root dependency installation: the fixture's tsx configuration resolves
      # identity.ts's capability re-export to the actual scope-capabilities source.
      # Shared Mermaid rendering and sharing UI use fixture-pinned browser dependencies.
      # Keep checkout paths and filters in sync with imported verifier and UI sources.
      - name: Prepare pinned upstream packages and locked fixture dependencies
        run: npm run setup
      - name: Test provider fixtures and the pinned Repo integration
        run: npm test
      - name: Build native Pages Worker and browser
        run: npm run build --workspace @nteract/pages-native-experiment

  # Builds the release bundle from a tree no test has run in, so the receipt
  # can say source_dirty false. stageArtifacts checks every file against the
  # receipt before it writes the bundle outside the checkout. A deploy of
  # this artifact must still require the whole run to be green.
  release:
    name: Pages release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/pages
            apps/notebook-cloud/src
            packages/runtimed/src
            packages/local-oidc/src
            src/components/markdown
            src/components/sharing
            src/styles
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare pinned upstream packages and locked fixture dependencies
        run: npm run setup
      - name: Build native Pages Worker and browser
        run: npm run build --workspace @nteract/pages-native-experiment
      - name: Stage and verify the release bundle
        working-directory: apps/pages/pages
        env:
          RELEASE_DIR: ${{ runner.temp }}/pages-release
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";
          import path from "node:path";
          import { stageArtifacts } from "./scripts/stage-artifacts.mjs";

          const { RELEASE_DIR, SOURCE_SHA, GITHUB_STEP_SUMMARY } = process.env;
          stageArtifacts("dist", RELEASE_DIR);
          const receipt = JSON.parse(
            readFileSync(path.join(RELEASE_DIR, "build-receipt.json"), "utf8"),
          );
          if (receipt.source_sha !== SOURCE_SHA)
            throw new Error(`Receipt source_sha ${receipt.source_sha} is not ${SOURCE_SHA}`);
          if (receipt.source_dirty !== false)
            throw new Error("Receipt says the build tree was dirty");
          console.log(`build_id=${receipt.build_id}`);
          console.log(`source_sha=${receipt.source_sha}`);
          console.log(`files=${Object.keys(receipt.files).length}`);
          appendFileSync(
            GITHUB_STEP_SUMMARY,
            [
              "### Pages release bundle",
              "",
              `- build_id: \`${receipt.build_id}\``,
              `- source_sha: \`${receipt.source_sha}\``,
              `- files: ${Object.keys(receipt.files).length} certified, plus build-receipt.json`,
              "",
            ].join("\n"),
          );
          EOF
      - name: Upload the release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-release
          path: ${{ runner.temp }}/pages-release
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}

  # The native suite is most of the gate's wall time, so it runs as parallel
  # shards of the same file list. Node sorts the test files and gives file k to
  # shard (k mod total) + 1, so the legs are disjoint and together run every
  # file. The total is the matrix length: list each shard number once, 1..N.
  # --test-shard goes through NODE_OPTIONS because Node only reads it before
  # the file list, and the package script ends with the file globs.
  native:
    name: Native Pages model, policy, and MCP (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/pages
            apps/notebook-cloud/src
            packages/runtimed/src
            packages/local-oidc/src
            src/components/markdown
            src/components/sharing
            src/styles
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare pinned upstream packages and locked fixture dependencies
        run: npm run setup
      - name: Test native Pages model, policy, and MCP
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm test --workspace @nteract/pages-native-experiment
