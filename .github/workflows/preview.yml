name: PR preview
run-name: Preview pr-${{ github.event.number }} (${{ github.event.action }})

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions: {}

jobs:
  preview:
    name: PR preview
    # The controller rejects forks. Skip unsupported requests before starting
    # the reusable workflow; its authorization checks remain authoritative.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Deployment authority is the reviewed reusable workflow, not this caller.
    uses: nteract/nteract/.github/workflows/preview-reusable.yml@4fb475a139a78a7fe78ecfe6b5f87b7035ca77f3
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
