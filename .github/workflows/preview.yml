name: PR preview
run-name: Preview pr-${{ github.event.number }} (${{ github.event.action }})

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions: {}

jobs:
  preview:
    name: PR preview
    # Deployment authority is the reviewed reusable workflow, not this caller.
    uses: nteract/nteract/.github/workflows/preview-reusable.yml@29607f933c85f5f53f1c213f093224e16cf2b7ad
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
