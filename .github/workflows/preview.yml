name: PR preview
run-name: Preview pr-${{ github.event.number }} (${{ github.event.action }})

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions: {}

jobs:
  preview:
    name: PR preview
    # Deployment authority is the reviewed reusable workflow, not this caller.
    uses: nteract/nteract/.github/workflows/preview-reusable.yml@b389d50df32acb8143d268e5c011fa4d240f5406
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
