name: PR preview
run-name: Preview pr-${{ github.event.number }} (${{ github.event.action }})

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions: {}

jobs:
  preview:
    name: PR preview
    # Deployment authority is the reviewed reusable workflow, not this caller.
    uses: nteract/nteract/.github/workflows/preview-reusable.yml@c5f6fdfb93e4853cd7143f875f37e9573e4264c1
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
