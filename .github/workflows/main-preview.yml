name: Main preview

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  deploy:
    name: Main preview
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      actions: read
      id-token: write
