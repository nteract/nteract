name: Nix

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'
      - 'scripts/ci/update-pnpm-deps-hash.mjs'
      - 'scripts/tests/nix-hash-update.test.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nix dependency hashes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Test hash updater
        run: node --test scripts/tests/nix-hash-update.test.mjs

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build pnpm and its dependency store
        run: nix build --no-link .#checks.x86_64-linux.pnpm-toolchain .#pnpmDeps

  update-hashes:
    name: Update Nix hashes
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test hash updater
        run: node --test scripts/tests/nix-hash-update.test.mjs

      - name: Check and update pnpmDeps hash
        id: check
        run: |
          set -euo pipefail
          EXPECTED_DERIVATION=$(nix eval --raw .#pnpmDeps.drvPath)

          run_pnpm_deps_build() {
            local attempt="$1"
            OUTPUT_FILE="$RUNNER_TEMP/pnpm-deps-build-${attempt}.log"

            echo "::group::nix build .#pnpmDeps (attempt ${attempt})"
            set +e
            nix build .#pnpmDeps --no-link > "$OUTPUT_FILE" 2>&1
            EXIT=$?
            set -e
            cat "$OUTPUT_FILE"
            echo "::endgroup::"
          }

          is_transient_store_error() {
            grep -Eq 'creating file ".*/nix/store/tmp-[^"]+/.+": No such file or directory' "$1"
          }

          run_pnpm_deps_build 1

          # Retry only the known transient materialization error. The updater
          # below rejects mismatches from any derivation other than pnpmDeps.
          if [ "$EXIT" -ne 0 ] && ! grep -q 'hash mismatch in fixed-output derivation' "$OUTPUT_FILE" && is_transient_store_error "$OUTPUT_FILE"; then
            echo "pnpmDeps build hit a transient Nix store materialization error; retrying once..."
            run_pnpm_deps_build 2
          fi

          if [ $EXIT -eq 0 ]; then
            echo "hash_ok=true" >> "$GITHUB_OUTPUT"
            echo "pnpmDeps hash is up to date"
          else
            node scripts/ci/update-pnpm-deps-hash.mjs flake.nix "$OUTPUT_FILE" "$EXPECTED_DERIVATION"
            # Do not publish an unverified replacement, even if extraction succeeded.
            nix build .#pnpmDeps --no-link
            echo "hash_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.check.outputs.hash_ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/nix-hash-update"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add flake.nix
          git commit -m "chore(nix): update pnpmDeps hash"
          git push --force origin "$BRANCH"

          # create PR if none exists, otherwise force-push updates it
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --title "chore(nix): update pnpmDeps hash" \
              --body "Automated update of the pnpmDeps hash in flake.nix. Triggered because pnpm-lock.yaml changed and the pre-fetched offline store hash is stale." \
              --head "$BRANCH"
          else
            echo "PR #$EXISTING already exists, branch updated via force-push"
          fi
