name: Release validation

# Exercise release checks without publishing packages, tags, or signed apps.
on:
  pull_request:
    paths:
      - .github/workflows/release-common.yml
      - .github/workflows/release-nightly.yml
      - .github/workflows/release-stable.yml
      - .github/workflows/release-validation.yml
      - .github/workflows/pr-binary-generation.yml
      - .github/workflows/publish-npm.yml
      - .cargo/config.toml
      - scripts/ci/audit-linux-node.mjs
      - scripts/ci/audit-windows-crt-imports.mjs
      - scripts/ci/check-release-tag.sh
      - scripts/ci/npm-release*
      - scripts/ci/smoke-windows-node-addon.cjs
      - scripts/ci/smoke-windows-wheel.py
      - scripts/ci/smoke-linux-arm64-wheel.py
      - scripts/ci/stage-notebook-sidecars.sh
      - scripts/ci/install-linuxdeploy.sh
      - scripts/ci/install-tauri-cli.sh
      - scripts/ci/fedora-appimage-smoke.sh
      - scripts/tests/test_release_tag.py
      - scripts/tests/audit-linux-node.test.mjs
      - scripts/tests/audit-windows-crt-imports.test.mjs
      - scripts/tests/release-workflow.test.mjs
      - scripts/tests/stage-notebook-sidecars.test.mjs
      - scripts/tests/npm-*.mjs
      - crates/runtimed-node/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - packages/runtimed-node/**
      - python/runtimed/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tag:
    name: Release publication safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --test scripts/tests/audit-linux-node.test.mjs scripts/tests/audit-windows-crt-imports.test.mjs scripts/tests/release-workflow.test.mjs scripts/tests/stage-notebook-sidecars.test.mjs scripts/tests/npm-*.mjs
      - run: python3 -m unittest scripts/tests/test_release_tag.py -v

  windows-npm-packaging:
    name: Windows npm packaging
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Match the publisher's Git Bash PATH and Windows archive paths.
      - shell: bash
        run: node --test scripts/tests/npm-publish.test.mjs

  windows-wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native Windows ARM64 wheel
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
          - name: Native Windows x64 wheel
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
    env:
      RUNT_BUILD_CHANNEL: nightly
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - uses: ./.github/actions/build-runtime-artifacts
      - name: Build bundled daemon and prerelease wheel
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p runtimed
          cp target/${{ matrix.target }}/release/runtimed.exe python/runtimed/src/runtimed/_bin/
          # A prerelease catches accidental fallback to a stable PyPI package.
          sed -i 's/^version = .*/version = "0.0.0a1"/' python/runtimed/pyproject.toml
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python/runtimed
          sccache: false
          maturin-version: "v1.11.5"
      - name: Audit Windows CRT imports
        shell: bash
        run: node scripts/ci/audit-windows-crt-imports.mjs --machine ${{ matrix.arch }} target/${{ matrix.target }}/release/runtimed.exe python/runtimed/dist/*.whl
      - name: Smoke produced wheel
        shell: pwsh
        run: |
          python scripts/ci/smoke-windows-wheel.py ${{ matrix.arch }} python/runtimed/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke standalone daemon (separate from wheel)
        shell: pwsh
        run: |
          & ./target/${{ matrix.target }}/release/runtimed.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Build the real @runtimed/node addon on each native Windows runner, audit
  # its CRT imports, and load that exact file in Node and in Bun.
  windows-node-addon:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native Windows ARM64 npm addon
            runner: windows-11-vs2026-arm
            target: win32-arm64-msvc
            arch: arm64
          - name: Native Windows x64 npm addon
            runner: windows-latest
            target: win32-x64-msvc
            arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-${{ matrix.target }}
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native binding
        run: pnpm --dir packages/runtimed-node build
      - name: Assemble platform package
        run: pnpm --dir packages/runtimed-node assemble:platform -- --expected-target "${{ matrix.target }}"
      - name: Audit Windows CRT imports
        shell: bash
        run: node scripts/ci/audit-windows-crt-imports.mjs --machine ${{ matrix.arch }} "packages/runtimed-node/npm/${{ matrix.target }}"
      - name: Load addon in Node
        shell: bash
        run: node scripts/ci/smoke-windows-node-addon.cjs ${{ matrix.arch }} "packages/runtimed-node/npm/${{ matrix.target }}/runtimed-node.${{ matrix.target }}.node"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - name: Load addon in Bun
        shell: bash
        run: bun scripts/ci/smoke-windows-node-addon.cjs ${{ matrix.arch }} "packages/runtimed-node/npm/${{ matrix.target }}/runtimed-node.${{ matrix.target }}.node"

  linux-node-addon:
    name: Linux npm package (${{ matrix.arch }}, Ubuntu 22.04)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUNT_BUILD_CHANNEL: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-linux-${{ matrix.arch }}-glibc235
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack native addon and wrapper
        env:
          TARGET: linux-${{ matrix.arch }}-gnu
        run: |
          pnpm --dir packages/runtimed-node build
          pnpm --dir packages/runtimed-node assemble:platform -- --expected-target "$TARGET"
          mkdir -p "$RUNNER_TEMP/npm-linux/native" "$RUNNER_TEMP/npm-linux/wrapper"
          pnpm --dir "packages/runtimed-node/npm/$TARGET" pack --pack-destination "$RUNNER_TEMP/npm-linux/native"
          pnpm --dir packages/runtimed-node pack --pack-destination "$RUNNER_TEMP/npm-linux/wrapper"
      - name: Install, audit and load the packed packages on the oldest supported userspace
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: linux-${{ matrix.arch }}-gnu
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-linux/installed" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-linux/native/"*.tgz "$RUNNER_TEMP/npm-linux/wrapper/"*.tgz
          ADDON="$RUNNER_TEMP/npm-linux/installed/node_modules/@runtimed/node-$TARGET/runtimed-node.$TARGET.node"
          node scripts/ci/audit-linux-node.mjs "$ARCH" "$ADDON"
          export ADDON
          node <<'JS'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          assert.equal(process.arch, process.env.ARCH);
          assert.equal(process.report.getReport().header.glibcVersionRuntime, '2.35');
          const wrapper = path.join(process.env.RUNNER_TEMP, 'npm-linux/installed/node_modules/@runtimed/node');
          const rt = require(wrapper);
          assert.equal(typeof rt.defaultSocketPath(), 'string');
          assert.ok(require.cache[require.resolve(process.env.ADDON)], 'wrapper must load the audited, installed addon');
          console.log('Loaded packed wrapper and native addon:', process.env.ADDON);
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: npm-linux-glibc235-${{ matrix.arch }}
          path: ${{ runner.temp }}/npm-linux/**/*.tgz
          if-no-files-found: error

  linux-arm64-packages:
    name: Native Linux ARM64 wheel and npm package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      RUNT_BUILD_CHANNEL: stable
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ./.github/actions/build-runtime-artifacts
      - name: Build bundled daemon and prerelease wheel
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu -p runtimed
          cp target/aarch64-unknown-linux-gnu/release/runtimed python/runtimed/src/runtimed/_bin/
          sed -i 's/^version = .*/version = "0.0.0a1"/' python/runtimed/pyproject.toml
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist
          working-directory: python/runtimed
          sccache: false
          maturin-version: "v1.11.5"
      - name: Smoke produced wheel
        run: python scripts/ci/smoke-linux-arm64-wheel.py python/runtimed/dist
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build and smoke native npm package
        run: |
          pnpm --dir packages/runtimed-node build
          pnpm --dir packages/runtimed-node assemble:platform -- --expected-target linux-arm64-gnu
          pnpm --dir packages/runtimed-node smoke
          pnpm --dir packages/runtimed-node/npm/linux-arm64-gnu pack --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Smoke npm API against the built daemon
        timeout-minutes: 5
        run: |
          export RUNTIMED_SOCKET_PATH="$RUNNER_TEMP/node-smoke.sock"
          export XDG_CACHE_HOME="$RUNNER_TEMP/node-smoke-cache"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/node-smoke-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/node-smoke-data"
          DAEMON_LOG="$RUNNER_TEMP/node-smoke.log"
          target/aarch64-unknown-linux-gnu/release/runtimed run \
            --socket "$RUNTIMED_SOCKET_PATH" \
            --uv-pool-size 0 --conda-pool-size 0 --pixi-pool-size 0 >"$DAEMON_LOG" 2>&1 &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true; wait "$DAEMON_PID" 2>/dev/null || true; cat "$DAEMON_LOG"' EXIT
          for _ in {1..60}; do
            if test -S "$RUNTIMED_SOCKET_PATH"; then break; fi
            kill -0 "$DAEMON_PID"
            sleep 1
          done
          test -S "$RUNTIMED_SOCKET_PATH"
          pnpm --dir packages/runtimed-node smoke:api
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-linux-arm64-gnu
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error

  linux-arm64-appimage:
    name: Native Linux ARM64 AppImage
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    env:
      RUNT_BUILD_CHANNEL: nightly
      LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-client.so*;libwayland-server.so*;libwayland-egl.so*;libwayland-cursor.so*"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-notebook-arm64
      - uses: ./.github/actions/build-runtime-artifacts
        with:
          include-mcp-widget: true
      - run: pnpm build
      - uses: ./.github/actions/install-tauri-cli
      - run: cargo xtask icons
      - name: Build and stage external binaries
        run: |
          cargo build --release -p runtimed -p runt -p nteract-mcp
          test "$(rustc --print host-tuple)" = aarch64-unknown-linux-gnu
          bash scripts/ci/stage-notebook-sidecars.sh aarch64-unknown-linux-gnu
      - run: bash scripts/ci/install-linuxdeploy.sh
      - name: Build AppImage without release signing
        working-directory: crates/notebook
        run: cargo tauri build --ci --bundles appimage --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
      - name: Smoke AppImage in Fedora ARM64
        run: |
          APPIMAGES=(target/release/bundle/appimage/*.AppImage)
          test "${#APPIMAGES[@]}" -eq 1
          test -f "${APPIMAGES[0]}"
          docker run --rm -v "${PWD}:/workspace" -w /workspace fedora:latest \
            bash -lc '
              set -euo pipefail
              dnf install -y coreutils findutils fuse-libs grep procps-ng systemd
              bash scripts/ci/fedora-appimage-smoke.sh "$1"
            ' bash "${APPIMAGES[0]}"
      - uses: actions/upload-artifact@v7
        with:
          name: validation-linux-arm64-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
