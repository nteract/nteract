name: Publish npm packages

# Keep this standalone workflow identity for npm OIDC trusted publishing.
# Builders have no publishing permission; publishers consume only packed artifacts.
# Stable uses the checked-in Node version/latest. Nightly uses that version plus
# the successful upstream run ID/nightly. @nteract/pi remains stable-only.
# Linux/Windows ARM64 require their NPM_*_ARM64_ENABLED bootstrap gates.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Stable Release or Nightly Release workflow run ID
        required: true
        type: string
      release_run_attempt:
        description: Successful attempt of that upstream release run
        required: true
        default: "1"
        type: string
  workflow_run:
    workflows: ["Stable Release", "Nightly Release"]
    types: [completed]

permissions:
  contents: read

# Serialize both channels, including manual retries, without replacing a waiting
# stable release with another nightly. Preflight still rejects stale candidates.
concurrency:
  group: npm-publish
  queue: max
  cancel-in-progress: false

env:
  NPM_TRUSTED_PUBLISHING_MIN_VERSION: 11.5.1

jobs:
  resolve-release:
    name: Resolve successful upstream release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      channel: ${{ steps.identity.outputs.channel }}
      run_id: ${{ steps.identity.outputs.run_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
      version: ${{ steps.plan.outputs.version }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      linux_arm64_enabled: ${{ steps.plan.outputs.linux_arm64_enabled }}
      windows_arm64_enabled: ${{ steps.plan.outputs.windows_arm64_enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate upstream workflow, attempt, repository, and source
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
        run: node scripts/ci/npm-release-cli.mjs resolve "$RUNNER_TEMP/release-identity.json"
      - name: Read version from the exact upstream source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: release-source
          persist-credentials: false
      - name: Prepare immutable npm release plan and publisher helpers
        id: plan
        env:
          NPM_LINUX_ARM64_ENABLED: ${{ vars.NPM_LINUX_ARM64_ENABLED }}
          NPM_WINDOWS_ARM64_ENABLED: ${{ vars.NPM_WINDOWS_ARM64_ENABLED }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release-tools"
          cp scripts/ci/npm-release*.mjs "$RUNNER_TEMP/npm-release-tools/"
          node scripts/ci/npm-release-cli.mjs plan "$RUNNER_TEMP/release-identity.json" release-source/packages/runtimed-node/package.json "$RUNNER_TEMP/npm-release-tools/plan.json"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-tools
          path: ${{ runner.temp }}/npm-release-tools/
          if-no-files-found: error
          retention-days: 7

  pack-native:
    name: Pack native package (${{ matrix.target }})
    needs: [resolve-release]
    runs-on: ${{ matrix.runner }}
    env:
      RUNT_BUILD_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      NTERACT_BUILD_GIT_HASH: ${{ needs.resolve-release.outputs.source_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          # Compile/link against the oldest supported userspace, not latest.
          - target: linux-x64-gnu
            runner: ubuntu-22.04
          - target: linux-arm64-gnu
            runner: ubuntu-22.04-arm
          - target: win32-x64-msvc
            runner: windows-latest
          - target: win32-arm64-msvc
            runner: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-tools
          path: ${{ runner.temp }}/npm-release-tools
      - uses: dsherret/rust-toolchain-file@v1
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp Node build versions
        shell: bash
        run: node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" stamp-build "$RUNNER_TEMP/npm-release-tools/plan.json" packages/runtimed-node
      - name: Build native binding
        run: pnpm --dir packages/runtimed-node build
      - name: Assemble platform package
        run: pnpm --dir packages/runtimed-node assemble:platform -- --expected-target "${{ matrix.target }}"
      - name: Audit Windows CRT imports
        if: startsWith(matrix.target, 'win32-')
        shell: bash
        run: node scripts/ci/audit-windows-crt-imports.mjs --machine "${{ matrix.target == 'win32-arm64-msvc' && 'arm64' || 'x64' }}" "packages/runtimed-node/npm/${{ matrix.target }}"
      - name: Smoke native binding
        if: matrix.target == 'win32-arm64-msvc' || matrix.target == 'linux-arm64-gnu'
        run: pnpm --dir packages/runtimed-node smoke
      - name: Verify platform package
        run: pnpm --dir packages/runtimed-node/npm/${{ matrix.target }} pack:dry-run
      - name: Pack platform package
        shell: bash
        run: pnpm --dir packages/runtimed-node/npm/${{ matrix.target }} pack --pack-destination "$RUNNER_TEMP"
      - name: Finalize packed platform manifest
        shell: bash
        run: node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" stamp-tarball "$RUNNER_TEMP/npm-release-tools/plan.json" "${{ matrix.target }}" "$RUNNER_TEMP"
      - name: Smoke installed native tarball and compiled channel
        shell: bash
        run: |
          TARBALLS=("$RUNNER_TEMP"/*.tgz)
          test "${#TARBALLS[@]}" -eq 1
          npm install --prefix "$RUNNER_TEMP/npm-native-smoke" --ignore-scripts --no-audit --no-fund "${TARBALLS[0]}"
          node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" smoke "$RUNNER_TEMP/npm-release-tools/plan.json" "${{ matrix.target }}" "$RUNNER_TEMP/npm-native-smoke"
      - name: Audit installed Linux addon against Ubuntu 22.04
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ARCH="${TARGET#linux-}"
          ARCH="${ARCH%-gnu}"
          node scripts/ci/audit-linux-node.mjs "$ARCH" "$RUNNER_TEMP/npm-native-smoke/node_modules/@runtimed/node-$TARGET/runtimed-node.$TARGET.node"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ matrix.target }}
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-native:
    name: Publish native package (${{ matrix.target }})
    needs: [resolve-release, pack-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, linux-x64-gnu, linux-arm64-gnu, win32-x64-msvc, win32-arm64-msvc]
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-tools
          path: ${{ runner.temp }}/npm-release-tools
      - uses: actions/download-artifact@v8
        with:
          name: npm-package-${{ matrix.target }}
          path: ${{ runner.temp }}/npm-package
      - name: Publish platform package
        if: (matrix.target != 'linux-arm64-gnu' || needs.resolve-release.outputs.linux_arm64_enabled == 'true') && (matrix.target != 'win32-arm64-msvc' || needs.resolve-release.outputs.windows_arm64_enabled == 'true')
        run: node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" publish "$RUNNER_TEMP/npm-release-tools/plan.json" "${{ matrix.target }}" "$RUNNER_TEMP/npm-package"
      - name: Report ARM64 bootstrap prerequisite
        if: (matrix.target == 'linux-arm64-gnu' && needs.resolve-release.outputs.linux_arm64_enabled != 'true') || (matrix.target == 'win32-arm64-msvc' && needs.resolve-release.outputs.windows_arm64_enabled != 'true')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "$TARGET npm publication is disabled until bootstrap and trusted publishing are configured." >> "$GITHUB_STEP_SUMMARY"
          echo "Download npm-package-$TARGET and follow RELEASING.md. Other npm platforms remain enabled." >> "$GITHUB_STEP_SUMMARY"

  pack-wrapper:
    name: Pack wrapper package
    needs: [resolve-release, publish-native]
    runs-on: ubuntu-latest
    env:
      RUNT_BUILD_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
      NTERACT_BUILD_GIT_HASH: ${{ needs.resolve-release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-tools
          path: ${{ runner.temp }}/npm-release-tools
      - uses: dsherret/rust-toolchain-file@v1
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp Node build versions
        run: node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" stamp-build "$RUNNER_TEMP/npm-release-tools/plan.json" packages/runtimed-node
      - name: Build native binding metadata
        run: pnpm --dir packages/runtimed-node build
      - name: Verify wrapper package
        run: pnpm --dir packages/runtimed-node pack:dry-run
      - name: Pack wrapper package
        run: pnpm --dir packages/runtimed-node pack --pack-destination "$RUNNER_TEMP"
      - name: Finalize packed wrapper manifest
        run: node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" stamp-tarball "$RUNNER_TEMP/npm-release-tools/plan.json" wrapper "$RUNNER_TEMP"
      - name: Verify wrapper package manifest
        run: |
          tar -xOf "$RUNNER_TEMP"/runtimed-node-*.tgz package/package.json > "$RUNNER_TEMP/wrapper-package.json"
          node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" verify "$RUNNER_TEMP/npm-release-tools/plan.json" wrapper "$RUNNER_TEMP/wrapper-package.json"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-wrapper
          path: ${{ runner.temp }}/runtimed-node-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-wrapper:
    name: Publish wrapper package
    needs: [pack-wrapper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-tools
          path: ${{ runner.temp }}/npm-release-tools
      - uses: actions/download-artifact@v8
        with:
          name: npm-package-wrapper
          path: ${{ runner.temp }}/npm-package
      - name: Publish wrapper package
        run: node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" publish "$RUNNER_TEMP/npm-release-tools/plan.json" wrapper "$RUNNER_TEMP/npm-package"
      - name: Record available immutable Node release
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-result
          path: ${{ runner.temp }}/npm-result/wrapper.json
          if-no-files-found: error
          retention-days: 30

  pack-pi:
    name: Pack Pi package
    needs: [resolve-release, publish-wrapper]
    if: needs.resolve-release.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-tools
          path: ${{ runner.temp }}/npm-release-tools
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Pi package
        run: pnpm --dir plugins/nteract/pi pack:dry-run
      - name: Pack Pi package
        run: pnpm --dir plugins/nteract/pi pack --pack-destination "$RUNNER_TEMP"
      - name: Verify Pi package manifest
        run: |
          tar -xOf "$RUNNER_TEMP"/nteract-pi-*.tgz package/package.json > "$RUNNER_TEMP/pi-package.json"
          node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" verify "$RUNNER_TEMP/npm-release-tools/plan.json" pi "$RUNNER_TEMP/pi-package.json"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-pi
          path: ${{ runner.temp }}/nteract-pi-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-pi:
    name: Publish Pi package
    needs: [pack-pi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-tools
          path: ${{ runner.temp }}/npm-release-tools
      - uses: actions/download-artifact@v8
        with:
          name: npm-package-pi
          path: ${{ runner.temp }}/npm-package
      - name: Publish Pi package
        run: node "$RUNNER_TEMP/npm-release-tools/npm-release-cli.mjs" publish "$RUNNER_TEMP/npm-release-tools/plan.json" pi "$RUNNER_TEMP/npm-package"
