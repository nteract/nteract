name: Preview workflow tests

on:
  pull_request:
    paths:
      - .github/preview/**
      - .github/workflows/preview*.yml
  push:
    branches: [main]
    paths:
      - .github/preview/**
      - .github/workflows/preview*.yml

permissions:
  contents: read

jobs:
  test:
    name: Preview helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/preview
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test .github/preview/*.test.mjs
